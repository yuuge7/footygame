name: Release

# Every push to main ships a new signed APK as "Footy Draft vX.Y".
# The version in version.properties is bumped and committed back first, so no release is ever overwritten.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Runs queue instead of overlapping, so two quick pushes can never claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_NAME: Footy Draft
  APK_PREFIX: FootyDraft

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. See README > Releases."
              missing=1
            fi
          done
          exit $missing

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Bump version, commit and tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --force --tags origin main
            git reset --hard origin/main

            name=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
            code=$(sed -n 's/^versionCode=//p' version.properties | tr -d '[:space:]')
            if ! [[ "$name" =~ ^[0-9]+\.[0-9]+$ && "$code" =~ ^[0-9]+$ ]]; then
              echo "::error::version.properties needs versionName=X.Y and a numeric versionCode (got '$name' / '$code')"
              exit 1
            fi

            # A version that already has a release moves to the next free minor; a hand-set one (e.g. 2.0) ships as is.
            major=${name%%.*}
            minor=${name#*.}
            while git rev-parse -q --verify "refs/tags/v$major.$minor" >/dev/null; do
              minor=$((minor + 1))
            done
            name="$major.$minor"
            code=$((code + 1))
            tag="v$name"

            sed -i -e "s/^versionName=.*/versionName=$name/" -e "s/^versionCode=.*/versionCode=$code/" version.properties
            git commit --quiet -am "chore(release): $tag [skip ci]"
            git tag "$tag"

            # Branch and tag land together or not at all.
            if git push --atomic origin HEAD:main "refs/tags/$tag"; then
              {
                echo "name=$name"
                echo "code=$code"
                echo "tag=$tag"
              } >> "$GITHUB_OUTPUT"
              echo "Releasing $APP_NAME $tag (versionCode $code)"
              exit 0
            fi

            echo "main moved while releasing (attempt $attempt), retrying"
            git tag -d "$tag"
            sleep $((attempt * 3))
          done

          echo "::error::Could not push the version bump after 5 attempts"
          exit 1

      - name: Build signed APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$SIGNING_STORE_FILE"
          ./gradlew assembleRelease
          rm -f "$SIGNING_STORE_FILE"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          apk="$APK_PREFIX-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$TAG" "$apk" \
            --title "$APP_NAME $TAG" \
            --generate-notes \
            --verify-tag
